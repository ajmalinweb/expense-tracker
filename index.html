<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="expense-tracker">
    <section class="head-section">
      <h1>Expense Tracker</h1>
    </section>
    <section class="balance-section">
      <div class="balance-board">
        <p>Your Balance</p>
        <h1 id="balance">$0.00</h1>
      </div>
      <div class="summary-card">
        <div class="summary-card-income bg-white">
          <p>Income</p>
          <h1 id="income">$0.00</h1>
        </div>
        <div class="summary-card-expense bg-white">
          <p>Expense</p>
          <h1 id="expense">$0.00</h1>
        </div>
      </div>
    </section>
    <section class="transaction-section">
      <section class="transaction-history">
        <h3>Transactions</h3>
        <div class="transactions">
          <ul id="list">
            <!-- <li class="transactions-list">
              <span>Airpod</span>
              <span>$200<span id="delete-btn">X</span></span>
            </li> -->
          </ul>
        </div>
      </section>
      <section class="add-transaction">
        <h3>Add Transactions</h3>
        <form>
          <div class="transaction-details">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Enter description">
          </div>
          <div class="transaction-details">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">
            <span>Use negative &#40;&#45;&#41; for expenses</span>
          </div>
          <button type="button" class="add-transaction-btn" id="add-btn">Add Transction</button>
        </form>
      </section>
    </section>

  </main>

  <script src="/js/script.js" type="module"></script>
</body>

</html>
